# ============================================================
# GitHub Pages: push a main → build estático → publica en Pages.
#
# OJO: con este archivo, un push a main PUBLICA el sitio. No se hace push sin
# el OK de Cori.
#
# Variables del repo (Settings → Secrets and variables → Actions → Variables):
#   SITE_URL   default https://tennibel.github.io
#   BASE_PATH  default /coahuila-mfg-connect/   (con diagonal final)
# Para el dominio propio: SITE_URL=https://coahuilamfgconnect.com, BASE_PATH=/
# (y el archivo public/CNAME con el dominio).
# ============================================================

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://tennibel.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/coahuila-mfg-connect/' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
